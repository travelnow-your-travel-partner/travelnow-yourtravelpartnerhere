<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>TravelNow enquiry</title><meta name="robots" content="noindex"></head>
  <body>
    <form name="travel-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="travel-enquiry">
      <input name="bot-field">
      <input name="name">
      <input name="phone" type="tel">
      <input name="email" type="email">
      <input name="destination">
      <input name="date" type="date">
      <select name="travellers"><option value=""></option><option value="1">1</option><option value="2">2</option><option value="3–5">3–5</option><option value="6+">6+</option></select>
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox">
    </form>
  </body>
</html>
